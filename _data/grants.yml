    - Liberty
  content: >-
    As the fund’s work develops, I’ll share updates about organizations connected to Philoptochos, Ukraine, and Liberty. An entry may describe an organization and its work, what the fund has recommended or supported, and how I assessed that work—for example, its track record, local presence, and ability to reach people. Where I have a result or follow-up I can substantiate, I’ll include it. I’ll clearly distinguish a grant recommendation from a grant that has been approved or completed.
