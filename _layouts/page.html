---
layout: default
bodyClass: page-basic
---
<main class="editorial-page">
  <div class="container">
    <header class="page-heading">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
    <div class="editorial-copy">{{ content }}</div>
  </div>
</main>
