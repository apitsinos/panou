<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <a href="{{ '/' | relative_url }}">The Panou Fund</a>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
          {% assign menu = site.data.menus.main | sort: 'weight' %}
          {% for item in menu %}
            <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.name }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <h2>The Panou Fund</h2>
        </div>
        <nav aria-label="Footer navigation">
          {% assign footermenu = site.data.menus.footer | sort: 'weight' %}
          {% for item in footermenu %}
            <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
          {% endfor %}
        </nav>
      </div>
    </footer>
  </body>
</html>
