<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/panou.css' | relative_url }}?v=20261101-2">
  <link rel="icon" href="{{ '/images/logo/panou-dogwood.svg' | relative_url }}" type="image/svg+xml">
</head>
<body class="page {{ layout.bodyClass }}">
  <div id="wrapper" class="wrapper">
    {% include header.html headerClass='header-extra' %}
    {{ content }}
  </div>
  {% include footer.html %}
  {% include sub-footer.html %}
  <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
</body>
</html>
