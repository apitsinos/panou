---
layout: default
---

<div class="hero">
  <div class="container hero-inner">
    <div class="hero-copy">
      <p class="eyebrow">The Panou Fund</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    </div>
  </div>
</div>

<div class="page-shell">
  <div class="container content-wrap">
    <article class="content-panel">
      {{ content }}
    </article>
  </div>
</div>
