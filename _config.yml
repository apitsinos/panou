baseurl: '/'
permalink: pretty
title: 'The Panou Fund'

logo:
  mobile: "images/logo/panou-fund.svg"
  mobile_height: "40"
  mobile_width: "168"
  desktop: "images/logo/panou-fund.svg"
  desktop_height: "50"
  desktop_width: "210"

home: 
  limit_services: 3

collections:
  initiatives:
    output: true
    sort_by: weight

defaults:
  - scope:
      path: ""
      type: "initiatives"
    values:
      layout: "initiative"
sass:
  style: compressed # possible values: nested expanded compact compressed

plugins: []

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
